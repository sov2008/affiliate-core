name: CI Build & Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Astro Check & Static Build
        run: npm run build

      - name: Verify Dist Artifact
        run: |
          test -d dist || { echo "dist directory not found"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          echo "Static site built successfully!"
