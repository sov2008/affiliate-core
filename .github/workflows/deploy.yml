name: Deploy to Production (DigitalOcean)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Droplet
    runs-on: ubuntu-latest
    if: github.repository == 'sov2008/affiliate-core'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Site
        run: npm run build

      - name: Deploy to DigitalOcean via SSH
        if: env.DO_SSH_KEY != ''
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST || '178.128.199.28' }}
          DO_SSH_USER: ${{ secrets.DO_SSH_USER || 'root' }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DO_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          tar -czf dist.tar.gz -C dist .
          scp -o StrictHostKeyChecking=no dist.tar.gz $DO_SSH_USER@$DO_SSH_HOST:/tmp/affiliate_core_dist.tar.gz
          ssh -o StrictHostKeyChecking=no $DO_SSH_USER@$DO_SSH_HOST "
            mkdir -p /var/www/affiliate-core/dist &&
            tar -xzf /tmp/affiliate_core_dist.tar.gz -C /var/www/affiliate-core/dist &&
            rm -f /tmp/affiliate_core_dist.tar.gz &&
            chown -R www-data:www-data /var/www/affiliate-core &&
            chmod -R 755 /var/www/affiliate-core
          "
          echo "Deployment to DigitalOcean finished successfully!"
